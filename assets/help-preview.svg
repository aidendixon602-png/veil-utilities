<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1f22"/><stop offset="1" stop-color="#18191c"/></linearGradient>
 <linearGradient id="blurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5865F2"/><stop offset="1" stop-color="#4752C4"/></linearGradient>
 <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<rect width="1100" height="720" rx="16" fill="url(#bg)"/>

<!-- Window Header -->
<rect x="0" y="0" width="1100" height="44" rx="16" fill="#2b2d31"/>
<rect x="0" y="32" width="1100" height="12" fill="#2b2d31"/>
<circle cx="28" cy="22" r="6" fill="#ed4245"/>
<circle cx="48" cy="22" r="6" fill="#fee75c"/>
<circle cx="68" cy="22" r="6" fill="#57f287"/>
<text x="550" y="27" text-anchor="middle" font-family="'gg sans', 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#949ba4"># bot-commands — Midtown Utilities Style Overhaul</text>

<!-- LEFT PANEL: Home Menu (,help) -->
<g transform="translate(36, 68)" filter="url(#sh)">
  <!-- Discord Message Author -->
  <circle cx="20" cy="20" r="18" fill="#b10f2e"/>
  <text x="20" y="26" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="15" font-weight="700" fill="#fff">V</text>
  <text x="50" y="20" font-family="'gg sans', sans-serif" font-size="15" font-weight="700" fill="#f2f3f5">Veil Utilities</text>
  <rect x="144" y="9" width="34" height="16" rx="4" fill="#5865F2"/>
  <text x="161" y="21" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="10" font-weight="700" fill="#fff">APP</text>
  <text x="188" y="21" font-family="'gg sans', sans-serif" font-size="12" fill="#949ba4">Today at 1:44 PM</text>

  <!-- Embed (Home Overview) -->
  <rect x="50" y="36" width="450" height="110" rx="8" fill="#2b2d31"/>
  <rect x="50" y="36" width="4" height="110" rx="2" fill="#5865F2"/>
  <circle cx="74" cy="58" r="10" fill="#b10f2e"/>
  <text x="74" y="62" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="10" font-weight="700" fill="#fff">V</text>
  <text x="92" y="62" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#f2f3f5">Veil Utilities</text>
  <text x="74" y="94" font-family="'gg sans', sans-serif" font-size="14" fill="#dbdee1">Select a category below to view its commands.</text>
  <text x="74" y="122" font-family="'gg sans', sans-serif" font-size="14" fill="#949ba4">prefix: <tspan fill="#f2f3f5" font-family="monospace">,</tspan></text>

  <!-- 2-Row Category Buttons -->
  <!-- Row 1 -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="82" height="36" rx="6" fill="#4e5058"/><text x="41" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">Utility</text>
    <rect x="90" y="0" width="82" height="36" rx="6" fill="#4e5058"/><text x="131" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">Music</text>
    <rect x="180" y="0" width="86" height="36" rx="6" fill="#4e5058"/><text x="223" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">Moderation</text>
    <rect x="274" y="0" width="82" height="36" rx="6" fill="#4e5058"/><text x="315" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">Roles</text>
    <rect x="364" y="0" width="86" height="36" rx="6" fill="#4e5058"/><text x="407" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">Permissions</text>
  </g>
  <!-- Row 2 -->
  <g transform="translate(50, 206)">
    <rect x="0" y="0" width="82" height="36" rx="6" fill="#4e5058"/><text x="41" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">Antinuke</text>
    <rect x="90" y="0" width="82" height="36" rx="6" fill="#4e5058"/><text x="131" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">Automod</text>
    <rect x="180" y="0" width="82" height="36" rx="6" fill="#4e5058"/><text x="221" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">Server</text>
    <rect x="270" y="0" width="86" height="36" rx="6" fill="#4e5058"/><text x="313" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">VoiceMaster</text>
    <rect x="364" y="0" width="86" height="36" rx="6" fill="#4e5058"/><text x="407" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">Community</text>
  </g>

  <!-- Feature callout card -->
  <rect x="50" y="260" width="450" height="280" rx="8" fill="#1e1f22" stroke="#35373c"/>
  <circle cx="70" cy="286" r="8" fill="#5865F2"/>
  <text x="70" y="290" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="10" font-weight="800" fill="#fff">✓</text>
  <text x="86" y="290" font-family="'gg sans', sans-serif" font-size="14" font-weight="700" fill="#5865F2">Server Protection &amp; Midtown Overhaul</text>
  <text x="70" y="322" font-family="'gg sans', sans-serif" font-size="13" fill="#dbdee1">• <tspan font-weight="700">Staff-Only Mode (</tspan><tspan font-family="monospace">,staffonly on</tspan><tspan>): normal users blocked</tspan></text>
  <text x="70" y="348" font-family="'gg sans', sans-serif" font-size="13" fill="#dbdee1">• <tspan font-weight="700">Bot Channels (</tspan><tspan font-family="monospace">,botchannels #cmd</tspan><tspan>): confine bot to rooms</tspan></text>
  <text x="70" y="374" font-family="'gg sans', sans-serif" font-size="13" fill="#dbdee1">• <tspan font-weight="700">Compact </tspan><tspan font-family="monospace">,permlevels</tspan><tspan>: single sleek card, fits in 1 screen</tspan></text>
  <text x="70" y="400" font-family="'gg sans', sans-serif" font-size="13" fill="#dbdee1">• <tspan font-weight="700">New Alias </tspan><tspan font-family="monospace">,perm add</tspan><tspan>: works character-for-character</tspan></text>
  <text x="70" y="426" font-family="'gg sans', sans-serif" font-size="13" fill="#dbdee1">• <tspan font-weight="700">Staff Notes (</tspan><tspan font-family="monospace">,notes &lt;user&gt;</tspan><tspan>): staff-only record keeper</tspan></text>
  <text x="70" y="452" font-family="'gg sans', sans-serif" font-size="13" fill="#dbdee1">• <tspan font-weight="700">Music Safeguard: </tspan>listeners can't kill music/clear queue</text>
  <text x="70" y="478" font-family="'gg sans', sans-serif" font-size="13" fill="#dbdee1">• <tspan font-weight="700">Snipe Buttons: </tspan>interactive <tspan font-family="monospace">&lt; Prev</tspan> and <tspan font-family="monospace">Next &gt;</tspan></text>
  <text x="70" y="512" font-family="'gg sans', sans-serif" font-size="12" fill="#57f287">✓ 166 unit tests passing • ruff clean • production-ready</text>
</g>

<!-- RIGHT PANEL: Category View (,help utility) -->
<g transform="translate(540, 68)" filter="url(#sh)">
  <!-- Embed (Category View with Mint Border) -->
  <rect x="20" y="36" width="500" height="490" rx="8" fill="#2b2d31"/>
  <rect x="20" y="36" width="4" height="490" rx="2" fill="#57F287"/>

  <text x="44" y="68" font-family="'gg sans', sans-serif" font-size="18" font-weight="700" fill="#f2f3f5">Utility</text>

  <!-- Command list formatted exactly like Midtown Utilities -->
  <g transform="translate(44, 96)" font-family="'gg sans', sans-serif" font-size="13">
    <text y="0" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,userinfo [user]</tspan> - show a user's profile info</text>
    <text y="24" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,avatar [user]</tspan> - display a user's avatar at full size</text>
    <text y="48" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,serverinfo</tspan> - show server stats and details</text>
    <text y="72" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,firstmsg [#channel]</tspan> - jump link to the first message in a channel</text>
    <text y="96" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,snipe</tspan> - show the last deleted messages in this channel</text>
    <text y="120" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,roleinfo &lt;role&gt;</tspan> - show a role's details and permissions</text>
    <text y="144" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,afk [reason]</tspan> - set yourself afk (clears when you send a message)</text>
    <text y="168" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,clearsnipe</tspan> - clear the snipe cache for this channel</text>
    <text y="192" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,notes &lt;member&gt;</tspan> - view staff notes for a member</text>
    <text y="216" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,roles</tspan> - paginated server role list (top -&gt; bottom)</text>
    <text y="240" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,botinfo</tspan> - show bot statistics and uptime</text>
    <text y="264" fill="#dbdee1"><tspan fill="#f2f3f5" font-family="monospace">,remind &lt;time&gt; &lt;text&gt;</tspan> - set a reminder</text>
  </g>

  <!-- Aliases Block -->
  <g transform="translate(44, 410)" font-family="'gg sans', sans-serif" font-size="12">
    <text y="0" font-weight="700" fill="#f2f3f5">Aliases: <tspan font-weight="400" fill="#dbdee1"><tspan font-family="monospace">userinfo</tspan> -&gt; <tspan font-family="monospace">ui info</tspan> · <tspan font-family="monospace">avatar</tspan> -&gt; <tspan font-family="monospace">av</tspan> · <tspan font-family="monospace">serverinfo</tspan> -&gt; <tspan font-family="monospace">si</tspan> · <tspan font-family="monospace">snipe</tspan> -&gt; <tspan font-family="monospace">s</tspan> · <tspan font-family="monospace">clearsnipe</tspan> -&gt; <tspan font-family="monospace">cs</tspan></tspan></text>
    <text y="24" fill="#949ba4">prefix: <tspan fill="#f2f3f5" font-family="monospace">,</tspan></text>
  </g>

  <!-- ONLY ONE BUTTON: Back -->
  <g transform="translate(20, 540)">
    <rect x="0" y="0" width="76" height="36" rx="6" fill="#4e5058"/>
    <text x="38" y="23" text-anchor="middle" font-family="'gg sans', sans-serif" font-size="13" font-weight="600" fill="#fff">Back</text>
  </g>
</g>
</svg>
