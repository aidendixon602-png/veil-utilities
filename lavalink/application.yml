# Lavalink v4 config for veil's music module.
# Run with: java -jar Lavalink.jar   (Java 17+, from https://github.com/lavalink-devs/Lavalink/releases)
# Then set LAVALINK_URI=http://localhost:2333 in .env
server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    clients: ["MUSIC", "WEB", "ANDROID_VR"]
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: false   # set true and fill in credentials below for Spotify links
    spotify:
      clientId: ""
      clientSecret: ""
      countryCode: "US"

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.3"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.3.0"
  server:
    password: "youshallnotpass"
    sources:
      youtube: false   # handled by the youtube plugin
      soundcloud: true
      bandcamp: true
      twitch: true
      http: true
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
