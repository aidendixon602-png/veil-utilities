name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate .env.example
        run: |
          python - <<'EOF'
          from dotenv import dotenv_values
          from core.config import Settings
          Settings.from_env({k: v for k, v in dotenv_values(".env.example").items() if v is not None})
          print(".env.example is valid")
          EOF
      - name: Tests
        run: python -m pytest -q

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pgserver
      - name: Verify PostgreSQL test dependencies
        run: python -c "import asyncpg, pgserver"
      - name: Test PostgreSQL against a disposable server
        run: python -m pytest -q tests/test_loops_and_postgres.py
