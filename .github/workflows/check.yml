name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q main.py core cogs scripts tests
      - name: Validate command documentation
        run: python scripts/gen_commands.py --check
      - name: Validate .env.example
        run: |
          python - <<'EOF'
          from dotenv import dotenv_values
          from core.config import Settings
          Settings.from_env({k: v for k, v in dotenv_values(".env.example").items() if v is not None})
          print(".env.example is valid")
          EOF
      - name: Tests
        run: |
          set +e
          python -m pytest -q --junitxml="$RUNNER_TEMP/pytest-results.xml"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'EOF'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "pytest-results.xml"
          if path.exists():
              for case in ET.parse(path).iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      # Report only the test identifier, not captured output or parameter values.
                      name = case.get("name", "unknown").split("[", 1)[0]
                      group = case.get("classname", "tests")
                      failure = case.find("failure")
                      if failure is None:
                          failure = case.find("error")
                      text = failure.text or ""
                      locations = re.findall(r"(?m)^((?:tests|core|cogs)/[\w./-]+\.py:\d+):", text)
                      types = re.findall(r"(?m)^E\s+([A-Za-z_][\w.]*(?:Error|Exception|Failure))\b", text)
                      details = ", ".join(locations[-3:] + types[-1:])
                      print(f"::error title=Test failure::{group}.{name} {details}")
          EOF
            exit "$status"
          fi

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pgserver
      - name: Verify PostgreSQL test dependencies
        run: python -c "import asyncpg, pgserver"
      - name: Test PostgreSQL against a disposable server
        run: python -m pytest -q tests/test_loops_and_postgres.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install pip-audit
      - name: Audit resolved runtime dependencies against PyPI
        run: python -m pip_audit --vulnerability-service pypi -r requirements.txt

  release-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate tag and project versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import ast
          import os
          import tomllib
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          bot = ast.parse(Path("core/bot.py").read_text())
          constants = [n.value.value for n in bot.body if isinstance(n, ast.Assign)
                       and any(isinstance(t, ast.Name) and t.id == "VERSION" for t in n.targets)
                       and isinstance(n.value, ast.Constant)]
          if tag != f"v{version}" or constants != [version]:
              raise SystemExit("Release tag, project version and bot version do not match")
          print(f"Release versions agree: {tag}")
          EOF
